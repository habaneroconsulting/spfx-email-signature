name: Build and package

on:
  workflow_call:
    inputs:
      zipped-package:
        description: Path to sppkg file
        required: false
        type: string

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compile source code
        run: npx heft build --clean --production

      - name: Create SharePoint Framework package
        run: npx heft package-solution --production

      - name: Upload SharePoint Framework package
        uses: actions/upload-artifact@v4
        if: ${{ inputs.zipped-package != '' }}
        with:
          name: package
          path: sharepoint/${{ inputs.zipped-package }}
